services:
  portal:
    image: "${PORTAL_IMAGE:-local/portal}:${PORTAL_VERSION:-dev}"
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: "${RUST_VERSION:-1.88}"
        PORTAL_VERSION: "${PORTAL_VERSION:-dev}"

    container_name: portal-dev

    ports:
      - "127.0.0.1:${PORTAL_PORT:-4181}:4181"

    configs:
      - source: portal_config
        target: /etc/portal/config.hcl
        mode: 0444

    volumes:
      - portal_data:/var/lib/portal

    secrets:
      - source: portal_superadmin_login
        target: portal_superadmin_login
        mode: 0400
      - source: portal_superadmin_password
        target: portal_superadmin_password
        mode: 0400

    # Deliberately not read_only in the local Compose profile. Compose needs to
    # materialize configs.content and secrets.environment before mounting them.
    # The runtime image itself remains FROM scratch and has no shell/package manager.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

configs:
  portal_config:
    content: |
      server {
        listen_address = "0.0.0.0:4181"
        workers             = 4
        max_body_bytes      = "32KiB"
        max_connections     = 1024
        max_headers         = 64
        max_header_bytes    = "32KiB"
        header_read_timeout = "10s"
        body_read_timeout   = "10s"
      }

      authentication {
        superadmin_login_file    = "/run/secrets/portal_superadmin_login"
        superadmin_password_file = "/run/secrets/portal_superadmin_password"
      }
      # A new user has no grant: give the grants in the settings pages.
      access {
        grants_mode = "dynamic"
      }
      storage {
        database = "/var/lib/portal/portal.db"
      }

      session {
        # "ephemeral": random signing key generated at process startup.
        # "provided": read the signing key from session.secret_file (or session.secret_env).
        # Opaque sessions themselves are always kept only in RAM and therefore
        # disappear on every process restart in both modes.
        secret_mode = "ephemeral"
        # secret_file = "/run/secrets/portal_session_secret"

        cookie_name         = "__Host-portal"
        ttl                 = "8h"
        same_site           = "Strict"
        max_active_sessions = 4096
      }

      security {
        max_password_bytes             = 1024
        max_forwarded_uri_bytes        = 4096
        max_cookie_header_bytes        = 8192
        login_rate_limit_enabled       = true
        login_attempts_per_ip              = 5
        login_window                       = "1m"
        login_lockout                      = "5m"

        # Distributed/botnet protection. Counts failed passwords globally and
        # is intentionally NOT cleared by a successful login.
        global_login_rate_limit_enabled   = true
        global_login_attempts              = 100
        global_login_window                = "1m"
        global_login_lockout               = "30s"

        max_rate_limit_entries             = 4096
        max_concurrent_password_checks     = 1
      }

      metrics {
        enabled = true
        path    = "/metrics"
      }

      logging {
        level = "info"
      }

secrets:
  portal_superadmin_login:
    environment: PORTAL_SUPERADMIN_LOGIN
  portal_superadmin_password:
    environment: PORTAL_SUPERADMIN_PASSWORD

volumes:
  portal_data:
