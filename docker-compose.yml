# Local stack: the portal with the inbox, and PostgreSQL. For development and tests, not for production.
#
#   deploy/compose/init-secrets.sh        # once: makes the secret files in deploy/compose/secrets/
#   docker compose up -d --build
#   docker compose down -v                # stops the stack and deletes the database
#
# The portal: http://127.0.0.1:4181/ (the sign-in is /auth/login). One port serves the pages, the API of the
# inbox for the senders and the webhooks (/api/v1/*), and the phones (/v1/enroll and /v1/session). No proxy is
# in front of this stack, so no ForwardAuth applies. The admin pages of the inbox are in the portal, in the tab
# "Inbox". No other port exists for the inbox.
#
# Environment (all optional):
#   PORTAL_PORT          host port of the portal (default 4181)
#   PORTAL_BIND          host address of the portal (default 127.0.0.1). Use 0.0.0.0 for a phone or an
#                        emulator on another host, and set inbox.devices.public_address in deploy/compose/config.hcl.
#   PORTAL_VERSION       version of the build (default: the version of Cargo.toml)
#   PORTAL_SECRETS_DIR   directory of the secret files (default: deploy/compose/secrets)
name: portal

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  portal:
    image: "portal:${PORTAL_IMAGE_TAG:-local}"
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PORTAL_VERSION: "${PORTAL_VERSION:-}"
        PORTAL_GIT_SHA: "${PORTAL_GIT_SHA:-unknown}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-4181}:4181"
    configs:
      - source: portal_config
        target: /etc/portal/config.hcl
    secrets:
      - superadmin_login
      - superadmin_password
      - session_secret
      - db_password
      - inbox_server_key
      - inbox_api_key
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

configs:
  portal_config:
    file: ./deploy/compose/config.hcl

# The files are bind mounts. init-secrets.sh makes them readable (0444) in a directory that only the owner reaches.
secrets:
  superadmin_login:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/superadmin_login
  superadmin_password:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/superadmin_password
  session_secret:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/session_secret
  db_password:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/db_password
  inbox_server_key:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/inbox_server_key
  inbox_api_key:
    file: ${PORTAL_SECRETS_DIR:-./deploy/compose/secrets}/inbox_api_key

volumes:
  postgres_data: {}
