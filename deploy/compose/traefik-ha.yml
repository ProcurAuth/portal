# Dynamic configuration of the proxy of docker-compose.ha.yml. Requests go to both instances in turn.
# The entry point "pages" serves everything: the pages, the API of the senders (/api/v1/), the agents (/mcp) and the
# phones (/v1/). The rule of the router inbox names the default path of inbox.mcp.path.
# A phone keeps one WebSocket on the instance that took it. The other instance wakes it through PostgreSQL.
# The routes of the inbox use the middleware inbox-retry: Traefik sends a request again to the other instance
# when the first one does not answer at all. It never sends a request again after the first byte of the answer,
# so a WebSocket upgrade that got `101` is not repeated.
http:
  routers:
    inbox:
      entryPoints: [pages]
      rule: "PathPrefix(`/v1/`) || PathPrefix(`/api/v1/`) || Path(`/mcp`) || Path(`/api/version`)"
      priority: 1000
      middlewares: [inbox-retry]
      service: pages
    # The proxy does not route metrics.path (`/metrics` in deploy/compose/config.hcl). To read the metrics, connect
    # Prometheus to the Compose network and read each instance on port 4181.
    pages:
      entryPoints: [pages]
      rule: "PathPrefix(`/`) && !Path(`/metrics`)"
      service: pages
  middlewares:
    inbox-retry:
      retry:
        attempts: 4
        initialInterval: 100ms
  services:
    pages:
      loadBalancer:
        servers:
        - url: "http://portal:4181"
        - url: "http://portal2:4181"
