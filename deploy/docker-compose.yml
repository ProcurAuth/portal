# Inbox with Docker Compose.
#
#   ./init-secrets.sh                 # once: server key, passwords, producer token
#   docker compose up -d --build
#
# Devices and the producer API use port 8080. The admin front (8081) is bound to
# localhost: reach it through an SSH tunnel or a TLS reverse proxy.
name: inbox

services:
  inbox:
    image: inbox:${INBOX_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        INBOX_GIT_SHA: ${INBOX_GIT_SHA:-unknown}
    restart: unless-stopped
    init: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    configs:
      - source: inbox_config
        target: /etc/inbox/config.hcl
    secrets:
      - source: inbox_server_key
        target: inbox_server_key
      - source: inbox_device_credential
        target: inbox_device_credential
      - source: inbox_admin_credential
        target: inbox_admin_credential
      - source: inbox_alerting_token
        target: inbox_alerting_token
    volumes:
      - inbox_data:/var/lib/inbox
    ports:
      - "${INBOX_DEVICE_PORT:-8080}:8080"
      - "127.0.0.1:${INBOX_ADMIN_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "/inbox", "healthcheck", "--config", "/etc/inbox/config.hcl"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 32m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

configs:
  inbox_config:
    file: ./config.hcl

# File-based secrets are bind mounts: init-secrets.sh makes them read-only (0444)
# inside a 0700 directory, so the container user can read them and other host
# users cannot reach them.
secrets:
  inbox_server_key:
    file: ./secrets/server_key
  inbox_device_credential:
    file: ./secrets/device_credential
  inbox_admin_credential:
    file: ./secrets/admin_credential
  inbox_alerting_token:
    file: ./secrets/alerting_token

volumes:
  inbox_data: {}
