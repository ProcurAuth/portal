# Dynamic configuration of inbox-edge (edge.yaml): a dedicated Traefik instance, started with
# --entrypoints.inbox.address=:8087, that relays phones, producers and webhooks to the devices listener of the portal.
# No authentication middleware: phones and producers prove themselves to the inbox (Noise session, bearer token).
#
# When a node is lost, the Service keeps the endpoint of its pod until the node is NotReady (about 35 s). A short dial
# timeout and a retry send those requests to another pod. A producer retry carries the same idempotency key, so the inbox
# accepts a retried alert one time.
http:
  middlewares:
    inbox-retry:
      retry:
        attempts: 4
        initialInterval: 100ms
  serversTransports:
    inbox:
      forwardingTimeouts:
        dialTimeout: 1s
        responseHeaderTimeout: 8s
        idleConnTimeout: 30s
  routers:
    inbox-devices:
      entryPoints: [inbox]
      rule: "PathPrefix(`/v1/`) || PathPrefix(`/api/v1/`)"
      middlewares: [inbox-retry]
      service: portal-devices
  services:
    portal-devices:
      loadBalancer:
        serversTransport: inbox
        servers:
        - url: "http://portal-devices.edge.svc.cluster.local:8080"
