# Dynamic configuration of inbox-edge (edge.yaml): a dedicated Traefik instance, started with
# --entrypoints.inbox.address=:8087, that relays the phones to the phone port of the portal.
# No authentication middleware: a phone proves itself to the inbox (Noise session). The producers use the domain of the
# portal, not this relay.
#
# When a node is lost, the Service keeps the endpoint of its pod until the node is NotReady (about 35 s). A short dial
# timeout and a retry send those requests to another pod.
http:
  middlewares:
    inbox-retry:
      retry:
        attempts: 4
        initialInterval: 100ms
  serversTransports:
    inbox:
      forwardingTimeouts:
        dialTimeout: 1s
        responseHeaderTimeout: 8s
        idleConnTimeout: 30s
  routers:
    inbox-devices:
      entryPoints: [inbox]
      rule: "PathPrefix(`/v1/`)"
      middlewares: [inbox-retry]
      service: portal-devices
  services:
    portal-devices:
      loadBalancer:
        serversTransport: inbox
        servers:
        - url: "http://portal-devices.edge.svc.cluster.local:8080"
