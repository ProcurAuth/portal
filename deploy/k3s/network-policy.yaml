# Network policies of the portal. The namespace edge denies all ingress by default, and the policies add up. The first
# two policies are in the cluster files already (same names, same content): applying them twice changes nothing.

# The pages, ForwardAuth, the API of the senders and the phones (WebSocket): port 4181 only, from the Traefik pods and
# the Prometheus pod. The portal trusts X-Forwarded-For from the pod network, so no other pod may reach this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-portal-http, namespace: edge}
spec:
  podSelector: {matchLabels: {app: portal}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: edge}}
          podSelector: {matchLabels: {app: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app: prometheus}}
      ports:
        - {protocol: TCP, port: 4181}
---
# The PDP: port 4182 only, from the pods that carry the label portal-pdp-client.
# The listener has no TLS. It serves the questions of the PDP and, with the block inbox.approvals, the approval API of
# the services (/approval/v1/requests). A request of this API holds the command to approve, in clear text. Keep this
# policy: no other pod may reach the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-portal-pdp, namespace: edge}
spec:
  podSelector: {matchLabels: {app: portal}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [apps, observability, edge]}
          podSelector: {matchLabels: {portal-pdp-client: "true"}}
      ports:
        - {protocol: TCP, port: 4182}
---
# The peers listener (8082) from the portal pods only: each request carries an HMAC of the server key.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-portal-peers, namespace: edge}
spec:
  podSelector: {matchLabels: {app: portal}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: portal}}
      ports:
        - {protocol: TCP, port: 8082}
---
# The database (namespace data) denies ingress by default. This admits the portal pods, and nothing else of the namespace edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-postgresql
  namespace: data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edge
      podSelector:
        matchLabels:
          app: portal
    ports:
    - {port: 5432, protocol: TCP}
