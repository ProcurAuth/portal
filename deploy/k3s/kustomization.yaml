# Manifests of the portal with the inbox for K3s. They are files: nothing applies them in this repository.
# Render them with `kubectl kustomize deploy/k3s`. The secret portal-secret must exist before the pods start:
# see deploy/README.md for its keys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- portal.yaml
- ingress.yaml
- edge.yaml
- network-policy.yaml
# A change of the configuration renames the ConfigMap, because the name has a hash. The pods then roll.
configMapGenerator:
- name: portal-config
  namespace: edge
  files:
  - config.hcl=config.hcl
- name: inbox-edge-config
  namespace: edge
  files:
  - dynamic.yaml=edge-dynamic.yaml
# The images. Build the portal image on this machine with `tools/build.sh image`, then load it in the registry of
# the cluster with your own tools. Change `newName` to the name that your registry uses.
images:
- name: portal
  newName: portal
  newTag: 5.0.0
- name: traefik
  newName: traefik
  newTag: v3.7.10
