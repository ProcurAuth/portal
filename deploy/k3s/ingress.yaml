# Routes of the portal. The middlewares forward-auth and secure-headers belong to the Traefik of the cluster
# (namespace edge). forward-auth calls http://portal.edge.svc.cluster.local:4181/auth/verify and copies the header
# X-Identity-Token to the request.
#
# The inbox is a feature of the portal. The producers and the webhooks use the same domain as the pages: the route
# portal-inbox sends /api/v1/ to the portal without ForwardAuth, because they have no session and prove themselves.
# The phones use the phone port, which has no route here: the relay inbox-edge (edge.yaml) serves it on host port
# 8087. The admin pages of the inbox are pages of the portal under /auth/settings/inbox.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/auth/`)
      priority: 50000
      services:
        - name: portal
          port: 4181
      middlewares:
        - name: secure-headers
  tls:
    secretName: traefik-tls
---
# The API of the inbox for the producers and the webhooks (Alertmanager, Grafana, scripts). No ForwardAuth: a producer
# sends a token or a key, and the inbox checks it. The path /api/version needs no session either.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-inbox
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/api/v1/`) || Path(`/api/version`)
      priority: 50000
      services:
        - name: portal
          port: 4181
  tls:
    secretName: traefik-tls
---
# The launcher. The portal checks the session itself, so there is no forward-auth middleware here.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-home
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Path(`/`)
      priority: 1
      services:
        - name: portal
          port: 4181
      middlewares:
        - name: secure-headers
  tls:
    secretName: traefik-tls
---
# Whatever no other route claims (a mistyped path): ForwardAuth first, so a visitor without a session lands on the
# login page whether or not the path exists. Past the gate the path is replaced by one that the portal does not serve,
# so the answer is a 404 and the endpoints of the portal (/metrics, /healthz) are not exposed on arbitrary paths.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-fallback-404
  namespace: edge
spec:
  replacePath:
    path: /__portal-fallback-404
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-fallback
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/`)
      priority: -1
      services:
        - name: portal
          port: 4181
      middlewares:
        - name: forward-auth
        - name: portal-fallback-404
        - name: secure-headers
  tls:
    secretName: traefik-tls
