[package]
name = "inbox-server"
description = "Inbox server: device sessions, alert fan-out, producer API and embedded admin front."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "inbox"
path = "src/main.rs"

[dependencies]
inbox-core = { path = "../inbox-core" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
hcl-rs = "0.19.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ipnet = { version = "2.12.2", features = ["serde"] }
sha2 = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }
libc = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "registry"] }
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = "0.33.0"
opentelemetry-appender-tracing = "0.33.0"
tracing-opentelemetry = "0.34.0"

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[build-dependencies]
sha2 = { workspace = true }
