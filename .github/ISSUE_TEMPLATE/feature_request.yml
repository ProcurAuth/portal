name: Feature request
description: Ask for a change or for a new function.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Say what you cannot do today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The change that you propose
      description: Say what the program must do. Say how the configuration file looks, if it changes.
  - type: textarea
    id: other
    attributes:
      label: Other ways to solve it
      description: Name the options that you considered, and why you do not choose them.
