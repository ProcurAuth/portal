name: docs

# Check the site, the links and the rules of ASD-STE100 of the documents (scripts/check-docs.py).
# The check makes no network request, and it builds nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the documents and the site
        run: python3 -I scripts/check-docs.py
