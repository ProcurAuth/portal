name: inbox-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep docker/build-push-action from uploading build records as artifacts.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Policy - never publish container images
        # Images are built locally only. No workflow may log in to or push to a registry.
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi
      - name: Toolchain image
        run: docker build -q -t inbox-dev tools/dev
      - uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/dev/Dockerfile') }}
          restore-keys: target-${{ runner.os }}-
      - name: Format
        run: tools/dev/cargo.sh fmt --all -- --check
      - name: Clippy (core, server, JNI bridge)
        run: tools/dev/cargo.sh clippy --locked -p inbox-core -p inbox-server -p inbox-android --all-targets -- -D warnings
      - name: PostgreSQL for the multi-instance tests
        run: |
          docker run -d --name inbox-pg -p 5432:5432 -e POSTGRES_PASSWORD=pw postgres:18-alpine -c max_connections=300
          for i in $(seq 1 30); do docker exec inbox-pg pg_isready -U postgres && break; sleep 1; done
      - name: Tests (SQLite, and the two-instance tests on PostgreSQL)
        env:
          INBOX_DEV_NETWORK: host
          INBOX_TEST_PG: 127.0.0.1:5432:postgres:pw
        run: tools/dev/cargo.sh test --locked -p inbox-core -p inbox-server -p inbox-android
      - name: End-to-end suite on PostgreSQL
        env:
          INBOX_DEV_NETWORK: host
          INBOX_TEST_PG: 127.0.0.1:5432:postgres:pw
          INBOX_E2E_BACKEND: postgres
        run: tools/dev/cargo.sh test --locked -p inbox-server --test e2e

  image:
    name: Image and compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: inbox:ci
          build-args: INBOX_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Compose up with generated secrets
        env:
          INBOX_IMAGE_TAG: ci
          INBOX_DEVICE_PASSWORD: ci-device-password
        run: |
          deploy/init-secrets.sh
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 60
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/api/version
          curl -fsS -o /dev/null http://127.0.0.1:8081/
          # The admin API has no password; it is protected by allowed_hosts and an anti-CSRF header.
          curl -fsS -o /dev/null http://127.0.0.1:8081/api/admin/overview
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"group":"infra","idempotency_key":"ci"}' http://127.0.0.1:8081/api/admin/alerts)
          [ "$code" = 403 ] || { echo "POST without X-Inbox-Request returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8081/api/admin/overview)
          [ "$code" != 200 ] || { echo "foreign Host header accepted"; exit 1; }
      - name: Logs
        if: always()
        env:
          INBOX_IMAGE_TAG: ci
        run: |
          docker compose -f deploy/docker-compose.yml logs --no-color || true
          docker compose -f deploy/docker-compose.yml down -v || true

  android:
    name: Android APK (compile check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway signing key (the APK is not uploaded)
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-store-pass \
            -keypass ci-store-pass -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Inbox CI"
      - name: Build APK
        env:
          INBOX_KEYSTORE: ${{ runner.temp }}/ci.jks
          INBOX_KEYSTORE_PASSWORD: ci-store-pass
          INBOX_KEY_ALIAS: ci
          INBOX_KEY_PASSWORD: ci-store-pass
        run: tools/android/build-apk.sh
