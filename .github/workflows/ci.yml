name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Require committed lockfile
        run: test -s Cargo.lock

      # Fetch once while the network is available. Every actual validation and
      # compilation step below is frozen and therefore cannot change resolution
      # or reach the registry.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --frozen --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --frozen --all-features

      - name: Release build
        run: cargo build --release --frozen

      - name: Install cargo-audit with the current stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable cargo install cargo-audit --locked

      - name: Dependency audit
        run: rustup run stable cargo audit
