name: CI

# This workflow is the fast path of a push and of a pull request. A job takes a few seconds to a few tens of seconds.
# It has no Docker image build and no full Rust compile. The heavy checks (clippy, the tests, the image, the Android app)
# are in nightly.yml. They also run before a release, and by hand (workflow_dispatch on a branch).
# The same checks run on a developer machine: tools/dev/heavy.sh (docs/development.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Another workflow (for example the release workflow) can call this workflow as a gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy (no image is published)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Never publish container images
        # Images are built locally only. No workflow may connect to a registry or push to it.
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|docker pus''h\b|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi

  fast:
    name: Rules, format and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The version of the Rust image of tools/dev/lint.sh. Change the two together.
      RUST_VERSION: "1.98"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Only rustfmt runs here. It reads the source and needs no dependency, so the job makes no build.
      - name: Cache the Rust toolchain
        id: toolchain
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_VERSION }}-*
            ~/.rustup/update-hashes/${{ env.RUST_VERSION }}-*
          key: rustup-${{ runner.os }}-${{ env.RUST_VERSION }}-rustfmt-v1
      - name: Install the Rust toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --no-self-update
      - name: Reads of the environment
        run: sh tools/dev/check-env-reads.sh
      - name: Format
        run: cargo "+$RUST_VERSION" fmt --all -- --check
      - name: Syntax of the shell scripts
        run: |
          status=0
          for file in $(git ls-files '*.sh'); do
            bash -n "$file" || status=1
          done
          exit "$status"
