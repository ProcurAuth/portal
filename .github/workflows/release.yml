name: Release

# A tag vX.Y.Z (or vX.Y.Z-suffix) starts the release. The tag must be equal to the version of Cargo.toml.
# CHANGELOG.md must have a section for the full version, for example "## [X.Y.Z] - DATE" (the forms of
# scripts/changelog-section.sh). A tag vX.Y.Z-suffix needs its own section "## [X.Y.Z-suffix] - DATE".
# The release has these files:
#   portal_<version>_linux_amd64.tar.gz   the static binary `portal` for Linux x86-64
#   portal_<version>_linux_arm64.tar.gz   the static binary `portal` for Linux AArch64
#   portal-inbox-<version>.apk            the Android app, signed with the release key
#   SHA256SUMS                            the SHA-256 of each archive and of the APK (the format of sha256sum)
# The notes of the release are the section of the version in CHANGELOG.md (scripts/changelog-section.sh).
# The workflows CI (ci.yml) and Nightly (nightly.yml) run first: a release never ships a commit that fails the checks.
# No job builds an image for a registry, logs in to a registry or publishes an image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash with -e and -o pipefail: a failure in a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version, notes and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Never publish container images
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|docker pus''h\b|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi
      - name: Identity of the build
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid tag $tag (expected vX.Y.Z[-suffix])"; exit 1
          fi
          version=$(tools/version.sh)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match the version $version of Cargo.toml"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "tag=$tag"; echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
      - name: Notes of the release
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The body of the section of the full version in CHANGELOG.md, without its heading.
          # For example "## [5.7.0] - DATE"; a tag v5.7.0-rc.1 needs "## [5.7.0-rc.1] - DATE".
          if ! scripts/changelog-section.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section with text for the version $VERSION, for example \"## [$VERSION] - DATE\""
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  # The fast checks of a push to main (ci.yml), then the heavy checks (nightly.yml): clippy, the tests, the image, the
  # configuration files and the Android app. Both workflows declare the trigger workflow_call for this use.
  # The release passes no secret to them. A release is rare, so it can wait for the heavy checks.
  checks:
    name: CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  heavy:
    name: Nightly checks
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/nightly.yml

  binaries:
    needs: [prepare, checks, heavy]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The runner has the architecture of the binary: tools/build.sh builds natively, then checks that it is static.
      # tools/build.sh gives the commit to the compiler as `git rev-parse --short=12 HEAD` (`git_sha` of /api/version).
      - name: Build the static binary
        run: tools/build.sh server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-${{ matrix.arch }}
          path: dist/portal_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}
          if-no-files-found: error

  apk:
    needs: [prepare, checks, heavy]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing: releases are signed with the release key"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          INBOX_KEYSTORE: ${{ runner.temp }}/release.jks
          INBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tools/build.sh apk
          test -f "dist/portal-inbox-${VERSION}.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/portal-inbox-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [prepare, binaries, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: notes
      # tools/build.sh dist makes the reproducible archives and SHA256SUMS from the files of dist/.
      - name: Archives and checksums
        run: |
          chmod 0755 dist/portal_*_linux_*
          tools/build.sh dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          options=()
          if [ "$PRERELEASE" = true ]; then options=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "portal $TAG" \
            --notes-file notes/notes.md "${options[@]}" \
            dist/portal_"${VERSION}"_linux_*.tar.gz "dist/portal-inbox-${VERSION}.apk" dist/SHA256SUMS
