name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (example: 2.0.0 or v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      plain: ${{ steps.version.outputs.plain }}
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION}"

          # Accept either "2.0.0" or "v2.0.0" from the GitHub UI.
          version="${version#v}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release version: $version" >&2
            echo "expected a semantic version such as 2.0.0 or v2.0.0" >&2
            exit 1
          }

          echo "plain=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing release v$version (Cargo.toml version is intentionally independent)."

  build:
    needs:
      - version
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            asset_arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            asset_arch: arm64
            rust_target: aarch64-unknown-linux-musl
          - platform: linux/arm/v7
            asset_arch: arm
            rust_target: armv7-unknown-linux-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable QEMU for non-native builders
        uses: docker/setup-qemu-action@v3

      # Run one native-architecture Rust container per target. The Rust musl
      # targets ship their own musl runtime/CRT support; deliberately do not
      # force Debian musl-gcc or +crt-static here.
      - name: Build and test inside target CPU architecture
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RELEASE_VERSION: ${{ needs.version.outputs.plain }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$PLATFORM" \
            --env RUST_TARGET="$RUST_TARGET" \
            --env RELEASE_VERSION="$RELEASE_VERSION" \
            --volume "$PWD:/work" \
            --workdir /work \
            rust:1.88-bookworm \
            bash -euxo pipefail -c '
              rustc --version
              cargo --version
              test -s Cargo.lock
              rustup target add "$RUST_TARGET"

              cargo fetch --locked
              cargo test --frozen

              PORTAL_RELEASE_VERSION="$RELEASE_VERSION" \
                cargo build --release --frozen --target "$RUST_TARGET"

              binary="target/${RUST_TARGET}/release/portal"
              test -x "$binary"

              actual="$($binary version)"
              expected="portal ${RELEASE_VERSION}"
              test "$actual" = "$expected" || {
                echo "unexpected binary version: $actual (expected: $expected)" >&2
                exit 1
              }
              echo "$actual"
            '

      - name: Verify architecture and scratch compatibility
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/${RUST_TARGET}/release/portal"

          test -x "$binary"
          file "$binary"
          readelf -h "$binary"
          readelf -l "$binary"

          case "$ASSET_ARCH" in
            amd64)
              readelf -h "$binary" | grep -Eq 'Machine:.*(Advanced Micro Devices X86-64|x86-64)'
              ;;
            arm64)
              readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
              ;;
            arm)
              readelf -h "$binary" | grep -Eq 'Machine:.*ARM'
              ;;
            *)
              echo "unsupported asset architecture: $ASSET_ARCH" >&2
              exit 1
              ;;
          esac

          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "binary requires a dynamic ELF interpreter; FROM scratch would not be valid" >&2
            readelf -l "$binary" >&2
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "binary has dynamic ELF dependencies; FROM scratch would not be valid" >&2
            readelf -d "$binary" >&2
            exit 1
          fi

      - name: Package deterministic tarball
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/${RUST_TARGET}/release/portal"
          archive="$(./scripts/package.sh "$VERSION" linux "$ASSET_ARCH" "$binary")"
          test "$(tar -tzf "$archive" | wc -l)" -eq 1
          tar -tzf "$archive" | grep -qx 'portal'

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ needs.version.outputs.tag }}
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: portal-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi

          # No --verify-tag here: when launched from the GitHub Actions UI,
          # gh release create will create the tag automatically at TARGET_SHA.
          gh release create "$RELEASE_TAG" \
            dist/*.tgz \
            --target "$TARGET_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
