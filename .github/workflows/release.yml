name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z). Created on the selected commit if it does not exist."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid tag $tag (expected vX.Y.Z[-suffix])"; exit 1
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match workspace version $version"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "tag=$tag"; echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build static binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          push: false
          outputs: type=local,dest=out
          build-args: INBOX_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Verify and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 tools/release/check-static.py out/inbox
          out/inbox version
          mkdir -p dist stage
          install -m 0755 out/inbox stage/inbox
          epoch=$(git log -1 --format=%ct)
          tar -C stage --owner=0 --group=0 --numeric-owner --mtime="@$epoch" -cf - inbox \
            | gzip -9n > "dist/inbox_${VERSION}_linux_${ARCH}.tar.gz"
          cp out/inbox "dist/inbox_linux_${ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  apk:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing: releases are signed with the release key"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          INBOX_KEYSTORE: ${{ runner.temp }}/release.jks
          INBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tools/android/build-apk.sh
          test -f "dist/inbox-${VERSION}.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/inbox-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  publish:
    needs: [prepare, binaries, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p release
          cp artifacts/*.tar.gz artifacts/*.apk release/
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Inbox ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.apk
            release/SHA256SUMS

  image:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true
      - name: Image context
        id: ctx
        run: |
          mkdir -p ctx/bin ctx/rootfs/var/lib/inbox ctx/rootfs/etc/inbox ctx/rootfs/tmp
          chmod 1777 ctx/rootfs/tmp
          cp artifacts/inbox_linux_* ctx/bin/
          chmod 0755 ctx/bin/*
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: tools/release/Dockerfile.image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.ctx.outputs.owner }}/inbox:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.prerelease != 'true' && format('ghcr.io/{0}/inbox:latest', steps.ctx.outputs.owner) || '' }}
