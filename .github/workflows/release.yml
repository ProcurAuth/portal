name: Release

# A tag vX.Y.Z starts the release. The tag must be equal to the version of Cargo.toml.
# The release holds the static binaries (amd64, arm64), the signed APK and SHA256SUMS.
# No container image is built here and none is published: images stay on the machine of the operator.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Never publish container images
        run: |
          # The pattern is split so that this line does not match itself.
          if grep -rnE 'ghcr''\.io|docker/login''-action|packages: *wr''ite|push: *tr''ue' .github/workflows; then
            echo "::error::workflows must not publish container images"
            exit 1
          fi
      - id: v
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid tag $tag (expected vX.Y.Z[-suffix])"; exit 1
          fi
          version=$(tools/version.sh)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match the version $version of Cargo.toml"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "tag=$tag"; echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The runner has the architecture of the binary: tools/build.sh builds natively, then checks that it is static.
      - name: Build the static binary
        run: tools/build.sh server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/portal_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}
          if-no-files-found: error

  apk:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing: releases are signed with the release key"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          INBOX_KEYSTORE: ${{ runner.temp }}/release.jks
          INBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tools/build.sh apk
          test -f "dist/portal-inbox-${VERSION}.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/portal-inbox-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  publish:
    needs: [prepare, binaries, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      # tools/build.sh dist makes the reproducible archives and SHA256SUMS from the files of dist/.
      - name: Archives and checksums
        run: |
          chmod 0755 dist/portal_*_linux_*
          tools/build.sh dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          pre=""
          [ "$PRERELEASE" = true ] && pre="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "portal $TAG" --generate-notes $pre \
            dist/portal_"${VERSION}"_linux_*.tar.gz "dist/portal-inbox-${VERSION}.apk" dist/SHA256SUMS
