# The workflows pin each action to a commit. Dependabot proposes the new commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/docker", "/tools/dev", "/tools/android"]
    schedule: { interval: weekly }
