http:
  routers:
    # This router must win over application catch-all routers for /auth/*.
    # The global entryPoint middleware still runs first; portal /auth/verify
    # explicitly allows the public login/logout/style paths to avoid a loop.
    portal:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/auth/`)"
      priority: 50000
      service: portal
      tls: {}

  services:
    portal:
      loadBalancer:
        servers:
          - url: "http://portal:4181"

  middlewares:
    portal:
      forwardAuth:
        address: "http://portal:4181/auth/verify"
        # Keep false. Traefik then writes X-Forwarded-Uri and X-Forwarded-Method from the
        # real request, and /auth/verify checks the request that Traefik routes.
        # With true, Traefik copies these headers from a trusted hop (forwardedHeaders.trustedIPs).
        # If the hop passes the headers of the client, a client can send
        # X-Forwarded-Uri: /auth/login and pass the gate without a session.
        # Set true only when each hop in front of Traefik overwrites or removes the
        # X-Forwarded-Uri, X-Forwarded-Method, X-Forwarded-Host and X-Forwarded-Proto
        # headers of the client. Most proxies keep them: check the configuration of the hop.
        # Behind a TCP load balancer, keep false and use entryPoints.<name>.proxyProtocol.
        # Behind an HTTP proxy with false, set session.bind = "user_agent" in the portal.
        trustForwardHeader: false
        preserveLocationHeader: true
        forwardBody: false
        maxResponseBodySize: 4096
        # The session is tied to the User-Agent and the client address (session.bind).
        # Without User-Agent here, the check sees the header of Traefik, not the header of the user.
        authRequestHeaders:
          - Cookie
          - User-Agent
        # The identity token of the service (portal identity block). Traefik copies it to the
        # request, and removes a header of the same name that the client sends.
        authResponseHeaders:
          - X-Identity-Token

    # The ForwardAuth of the keys. Use it on a router of its own for the agents,
    # for example PathPrefix(`/app/api/`) && HeaderRegexp(`Authorization`, `^Bearer mcp_`), with a
    # priority above the route of the persons. Never use `portal` on this router. The portal ignores
    # the cookies on this route. A route for keys is never in `portal.exclude`.
    portal-key:
      forwardAuth:
        address: "http://portal:4181/auth/verify-key"
        # Keep false, for the same reason as the middleware portal.
        trustForwardHeader: false
        authRequestHeaders:
          - Authorization
        authResponseHeaders:
          - X-Identity-Token

    # The service never gets the key.
    drop-authorization:
      headers:
        customRequestHeaders:
          Authorization: ""

    portal-key-chain:
      chain:
        middlewares:
          - portal-key
          - drop-authorization
