# Static Traefik configuration. The middleware is prepended to every HTTP
# router attached to websecure.
#
# A middleware on an entry point runs on every router of this entry point, also on a key route.
# A request that has only `Authorization: Bearer mcp_...` has no session, so /auth/verify refuses it
# before the key route sees it. The priority of a router does not change this. Agents therefore need
# one of two setups (see docs/traefik.md):
#   1. A dedicated entry point with no middleware, `websecure-agents` below. Put the key routers
#      on it, with the middleware portal-key-chain of traefik-dynamic.yaml.
#   2. No middleware on any entry point. Put portal on each router of a person, and
#      portal-key-chain on each key router, with a higher priority for the same path.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        - portal@file
      tls:
        options: default

    # A proxy or a load balancer in front of Traefik: list only its addresses here.
    # Keep forwardAuth.trustForwardHeader false in the middlewares of the portal
    # (see traefik-dynamic.yaml). trustedIPs does not remove the X-Forwarded-Uri and
    # X-Forwarded-Method headers that a client sends through the hop. With
    # trustForwardHeader true, the client then chooses the request that /auth/verify checks.
    # forwardedHeaders:
    #   trustedIPs:
    #     - "10.0.0.0/8"
    # A TCP load balancer can give the client address with the PROXY protocol instead:
    # proxyProtocol:
    #   trustedIPs:
    #     - "10.0.0.0/8"

  # The entry point of the agents: no middleware here. Its routers use portal-key-chain.
  # Remove this entry point when the agents share websecure (setup 2 above).
  websecure-agents:
    address: ":8443"
    http:
      tls:
        options: default
