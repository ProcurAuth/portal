# Traefik ends TLS for the entrypoint websecure. The certificate is the self-signed one that up.sh makes.
tls:
  certificates:
    - certFile: /etc/traefik/tls/tls.crt
      keyFile: /etc/traefik/tls/tls.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/tls/tls.crt
        keyFile: /etc/traefik/tls/tls.key
http:
  middlewares:
    # The ForwardAuth of the persons: the session cookie.
    portal-user:
      forwardAuth:
        address: "http://portal:4181/auth/verify"
        trustForwardHeader: false
        maxResponseBodySize: 4096
        preserveLocationHeader: true
        # The session is tied to the User-Agent (session.bind), so the check needs this header.
        authRequestHeaders: ["Cookie", "User-Agent"]
        authResponseHeaders: ["X-Identity-Token"]
    # The ForwardAuth of the keys: the header Authorization.
    portal-key:
      forwardAuth:
        address: "http://portal:4181/auth/verify-key"
        trustForwardHeader: false
        maxResponseBodySize: 4096
        authRequestHeaders: ["Authorization"]
        authResponseHeaders: ["X-Identity-Token"]
    # The service never sees the key.
    drop-authorization:
      headers:
        customRequestHeaders:
          Authorization: ""
    portal-key-chain:
      chain:
        middlewares: ["portal-key", "drop-authorization"]
    # The routes of the inbox: a request that the portal does not answer at all (a node that is lost, a
    # connection refused) goes to the Service again, up to 4 attempts, 100 ms apart at first. Traefik
    # retries only before the first byte of the answer. A WebSocket upgrade that got `101` is never
    # sent again, and an answer of the portal (also 503) is final.
    inbox-retry:
      retry:
        attempts: 4
        initialInterval: 100ms
