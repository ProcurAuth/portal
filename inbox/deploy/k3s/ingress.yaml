# Host-based routes: the admin front uses absolute paths, so it cannot live under
# a path prefix. Adjust the host names to your domain.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inbox
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    # Phones (/v1/enroll, /v1/session) and producers (/api/v1/...).
    match: Host(`inbox.example.org`) && (PathPrefix(`/v1/`) || PathPrefix(`/api/v1/`))
    services: [{name: inbox, port: 8080}]
  tls:
    secretName: traefik-tls
    options:
      name: home-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inbox-admin
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infra
    gethomepage.dev/name: Inbox
    gethomepage.dev/icon: mdi-bell-alert
    gethomepage.dev/href: https://inbox-admin.example.org/
    gethomepage.dev/description: Inbox admin front
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`inbox-admin.example.org`)
    services: [{name: inbox, port: 8081}]
    # Inbox's admin front has no password: this chain must authenticate users.
    # Keep the host in admin.allowed_hosts (config.hcl) in sync with this rule.
    middlewares: [{name: root-only-chain}]
  tls:
    secretName: traefik-tls
    options:
      name: home-tls
