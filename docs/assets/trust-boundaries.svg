<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Trust boundaries: the network, the proxy, portal with its checks, the services and the database">
<title>The trust boundaries of portal</title><desc>The network is not trusted: browsers, agents, senders and phones all send requests. Traefik is trusted to terminate TLS, to route and to set the forwarded headers. portal checks every request: sign-in, session, gate, key, form and phone session. The services are trusted to check the identity token and to ask the PDP, and not trusted with the session cookie. The database holds only digests and sealed secrets. The superadmin is trusted with everything.</desc>
<defs><marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker></defs>
<rect width="1100" height="520" rx="20" fill="#12142a"/>
<g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<text x="36" y="46" font-size="25" font-weight="700" fill="#ffffff">Who is trusted, and what portal checks</text>
<text x="36" y="73" font-size="15" fill="#9ca3d4">A boundary is a place where the portal does not trust what it receives.</text>
<rect x="30" y="100" width="220" height="330" rx="12" fill="#0c0e15" fill-opacity=".55" stroke="#4b52a8" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="140" y="128" font-size="16" font-weight="700" fill="#fecaca" text-anchor="middle">The network</text>
<text x="140" y="147" font-size="13" fill="#9ca3d4" text-anchor="middle">not trusted</text>
<rect x="48" y="166" width="184" height="54" rx="12" fill="#f87171" fill-opacity=".22" stroke="#f87171" stroke-width="1.6"/>
<text x="140.0" y="189.0" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">Browser</text>
<text x="140.0" y="210.0" font-size="12" fill="#fecaca" text-anchor="middle">cookie, forms</text>
<rect x="48" y="232" width="184" height="54" rx="12" fill="#f87171" fill-opacity=".22" stroke="#f87171" stroke-width="1.6"/>
<text x="140.0" y="255.0" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">Agent</text>
<text x="140.0" y="276.0" font-size="12" fill="#fecaca" text-anchor="middle">key mcp_...</text>
<rect x="48" y="298" width="184" height="54" rx="12" fill="#f87171" fill-opacity=".22" stroke="#f87171" stroke-width="1.6"/>
<text x="140.0" y="321.0" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">Sender</text>
<text x="140.0" y="342.0" font-size="12" fill="#fecaca" text-anchor="middle">key api_...</text>
<rect x="48" y="364" width="184" height="54" rx="12" fill="#f87171" fill-opacity=".22" stroke="#f87171" stroke-width="1.6"/>
<text x="140.0" y="387.0" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">Phone</text>
<text x="140.0" y="408.0" font-size="12" fill="#fecaca" text-anchor="middle">code, Noise session</text>
<path d="M234 266 L284 266" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="286" y="100" width="150" height="330" rx="12" fill="#0ea5e9" fill-opacity=".26" stroke="#38bdf8" stroke-width="1.6"/>
<text x="361" y="128" font-size="17" font-weight="700" fill="#e0f2fe" text-anchor="middle">Traefik</text>
<text x="361" y="147" font-size="13" fill="#bae6fd" text-anchor="middle">trusted for</text>
<text x="361" y="190" font-size="13" fill="#bae6fd" text-anchor="middle">TLS</text>
<text x="361" y="211" font-size="13" fill="#bae6fd" text-anchor="middle">routing</text>
<text x="361" y="232" font-size="13" fill="#bae6fd" text-anchor="middle">the forwarded headers</text>
<text x="361" y="253" font-size="13" fill="#bae6fd" text-anchor="middle"></text>
<text x="361" y="274" font-size="13" fill="#bae6fd" text-anchor="middle">the portal reads the</text>
<text x="361" y="295" font-size="13" fill="#bae6fd" text-anchor="middle">client address from</text>
<text x="361" y="316" font-size="13" fill="#bae6fd" text-anchor="middle">trusted_proxies only</text>
<path d="M438 266 L488 266" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="490" y="100" width="330" height="330" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="655" y="128" font-size="17" font-weight="700" fill="#e0e7ff" text-anchor="middle">portal</text>
<text x="655" y="147" font-size="13" fill="#c7d2fe" text-anchor="middle">checks every request</text>
<rect x="506" y="160" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="176" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Sign-in</text>
<text x="518" y="191" font-size="12" fill="#c7d2fe" text-anchor="start">one Argon2 check, limiters, same answer</text>
<rect x="506" y="204" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="220" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Session</text>
<text x="518" y="235" font-size="12" fill="#c7d2fe" text-anchor="start">opaque token, bound to address and browser</text>
<rect x="506" y="248" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="264" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Gate</text>
<text x="518" y="279" font-size="12" fill="#c7d2fe" text-anchor="start">every reading of the path must be allowed</text>
<rect x="506" y="292" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="308" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Key</text>
<text x="518" y="323" font-size="12" fill="#c7d2fe" text-anchor="start">form, kind, checksum, owner, grants</text>
<rect x="506" y="336" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="352" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Form</text>
<text x="518" y="367" font-size="12" fill="#c7d2fe" text-anchor="start">CSRF token and same-origin check</text>
<rect x="506" y="380" width="298" height="38" rx="8" fill="#12142a" fill-opacity=".55" stroke="#818cf8" stroke-opacity=".5"/>
<text x="518" y="396" font-size="13.5" font-weight="700" fill="#e0e7ff" text-anchor="start">Phone</text>
<text x="518" y="411" font-size="12" fill="#c7d2fe" text-anchor="start">one-time code, then a Noise IK session</text>
<rect x="880" y="100" width="190" height="150" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="975" y="128" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="middle">Your services</text>
<text x="975" y="154" font-size="12.5" fill="#c7d2fe" text-anchor="middle">trusted to check the</text>
<text x="975" y="173" font-size="12.5" fill="#c7d2fe" text-anchor="middle">identity token and to</text>
<text x="975" y="192" font-size="12.5" fill="#c7d2fe" text-anchor="middle">ask the PDP. Not trusted</text>
<text x="975" y="211" font-size="12.5" fill="#c7d2fe" text-anchor="middle">with the session cookie.</text>
<path d="M822 175 L878 175" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="880" y="270" width="190" height="70" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="1.6"/>
<text x="975.0" y="301.0" font-size="15" font-weight="700" fill="#d1fae5" text-anchor="middle">Superadmin</text>
<text x="975.0" y="322.0" font-size="12" fill="#a7f3d0" text-anchor="middle">trusted with everything</text>
<rect x="880" y="360" width="190" height="70" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="975.0" y="382.5" font-size="15" font-weight="700" fill="#a5b4fc" text-anchor="middle">Database</text>
<text x="975.0" y="403.5" font-size="12" fill="#c7d2fe" text-anchor="middle">digests and sealed</text>
<text x="975.0" y="420.5" font-size="12" fill="#c7d2fe" text-anchor="middle">secrets only</text>
<path d="M822 395 L878 395" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<text x="36" y="470" font-size="13" fill="#9ca3d4" text-anchor="start">The portal reads the client address from X-Forwarded-For only when the request comes from trusted_proxies.</text>
<text x="36" y="492" font-size="13" fill="#9ca3d4" text-anchor="start">A person who controls a service on the same origin is outside the defence: see the page Security model and hardening.</text>
</g>
</svg>
