<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="The gate: how /auth/verify decides, step by step">
<title>The gate of portal: the decision of /auth/verify</title><desc>Traefik asks portal about each request with ForwardAuth. A public sign-in path passes. A path that a service excludes passes with no session. A request with no session goes to the sign-in page. With a session, portal decides the action access on the service that owns the path. A grant gives status 204 and an identity token. No grant gives the denied page for a navigation, or status 403.</desc>
<defs><marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker><marker id="ah-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
<rect width="1280" height="520" rx="20" fill="#12142a"/>
<g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<text x="36" y="46" font-size="25" font-weight="700" fill="#ffffff">The gate decides each request in four steps</text>
<text x="36" y="73" font-size="15" fill="#9ca3d4">Traefik sends every request of a protected service to /auth/verify. portal answers from memory.</text>
<rect x="36" y="122" width="214" height="112" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="143.0" y="166.0" font-size="18" font-weight="700" fill="#e0e7ff" text-anchor="middle">Public path?</text>
<text x="143.0" y="190.0" font-size="13" fill="#c7d2fe" text-anchor="middle">the sign-in pages, the style</text>
<text x="143.0" y="208.0" font-size="13" fill="#c7d2fe" text-anchor="middle">and the theme script</text>
<circle cx="50" cy="126" r="12" fill="#4338ca"/>
<text x="50" y="130.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M252 178 L283 178" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="256.3" y="157" width="23.4" height="19" rx="4" fill="#12142a"/>
<text x="268.0" y="170" font-size="12" fill="#c7d2fe" text-anchor="middle">no</text>
<rect x="286" y="122" width="214" height="112" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="393.0" y="166.0" font-size="18" font-weight="700" fill="#e0e7ff" text-anchor="middle">Path excluded?</text>
<text x="393.0" y="190.0" font-size="13" fill="#c7d2fe" text-anchor="middle">a service declares it with</text>
<text x="393.0" y="208.0" font-size="13" fill="#c7d2fe" text-anchor="middle">portal.exclude (a webhook)</text>
<circle cx="300" cy="126" r="12" fill="#4338ca"/>
<text x="300" y="130.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<path d="M502 178 L533 178" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="506.3" y="157" width="23.4" height="19" rx="4" fill="#12142a"/>
<text x="518.0" y="170" font-size="12" fill="#c7d2fe" text-anchor="middle">no</text>
<rect x="536" y="122" width="214" height="112" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="643.0" y="166.0" font-size="18" font-weight="700" fill="#e0e7ff" text-anchor="middle">Valid session?</text>
<text x="643.0" y="190.0" font-size="13" fill="#c7d2fe" text-anchor="middle">the cookie, bound to the</text>
<text x="643.0" y="208.0" font-size="13" fill="#c7d2fe" text-anchor="middle">address and the browser</text>
<circle cx="550" cy="126" r="12" fill="#4338ca"/>
<text x="550" y="130.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<path d="M752 178 L783 178" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<rect x="752.9" y="157" width="30.2" height="19" rx="4" fill="#12142a"/>
<text x="768.0" y="170" font-size="12" fill="#c7d2fe" text-anchor="middle">yes</text>
<rect x="786" y="122" width="214" height="112" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="893.0" y="166.0" font-size="18" font-weight="700" fill="#e0e7ff" text-anchor="middle">Has access?</text>
<text x="893.0" y="190.0" font-size="13" fill="#c7d2fe" text-anchor="middle">the user holds the action</text>
<text x="893.0" y="208.0" font-size="13" fill="#c7d2fe" text-anchor="middle">access on the owner of the path</text>
<circle cx="800" cy="126" r="12" fill="#4338ca"/>
<text x="800" y="130.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="1036" y="122" width="208" height="112" rx="12" fill="#f87171" fill-opacity=".22" stroke="#f87171" stroke-width="1.6"/>
<text x="1140.0" y="162" font-size="17" font-weight="700" fill="#fee2e2" text-anchor="middle">Refused</text>
<text x="1140.0" y="186" font-size="12.5" fill="#fecaca" text-anchor="middle">302 /auth/denied for a page,</text>
<text x="1140.0" y="204" font-size="12.5" fill="#fecaca" text-anchor="middle">403 for any other request</text>
<path d="M1002 178 L1033 178" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ah-no)" stroke-linejoin="round"/>
<rect x="1005.3" y="157" width="23.4" height="19" rx="4" fill="#12142a"/>
<text x="1017.0" y="170" font-size="12" fill="#c7d2fe" text-anchor="middle">no</text>
<path d="M143.0 236 L143.0 290" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<rect x="149.9" y="257" width="30.2" height="19" rx="4" fill="#12142a"/>
<text x="165.0" y="270" font-size="12" fill="#c7d2fe" text-anchor="middle">yes</text>
<rect x="36" y="292" width="214" height="84" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="1.6"/>
<text x="143.0" y="330.0" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">204: let it pass</text>
<text x="143.0" y="352.0" font-size="13" fill="#a7f3d0" text-anchor="middle">no session needed</text>
<path d="M393.0 236 L393.0 290" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<rect x="399.9" y="257" width="30.2" height="19" rx="4" fill="#12142a"/>
<text x="415.0" y="270" font-size="12" fill="#c7d2fe" text-anchor="middle">yes</text>
<rect x="286" y="292" width="214" height="84" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="1.6"/>
<text x="393.0" y="330.0" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">204: let it pass</text>
<text x="393.0" y="352.0" font-size="13" fill="#a7f3d0" text-anchor="middle">no session, no token</text>
<path d="M643.0 236 L643.0 290" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah-warn)" stroke-linejoin="round"/>
<rect x="653.3" y="257" width="23.4" height="19" rx="4" fill="#12142a"/>
<text x="665.0" y="270" font-size="12" fill="#c7d2fe" text-anchor="middle">no</text>
<rect x="536" y="292" width="214" height="84" rx="12" fill="#fbbf24" fill-opacity=".20" stroke="#fbbf24" stroke-width="1.6"/>
<text x="643.0" y="330.0" font-size="16" font-weight="700" fill="#fef3c7" text-anchor="middle">302 to /auth/login</text>
<text x="643.0" y="352.0" font-size="13" fill="#fde68a" text-anchor="middle">with a signed return target</text>
<path d="M893.0 236 L893.0 290" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<rect x="899.9" y="257" width="30.2" height="19" rx="4" fill="#12142a"/>
<text x="915.0" y="270" font-size="12" fill="#c7d2fe" text-anchor="middle">yes</text>
<rect x="786" y="292" width="214" height="84" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="1.6"/>
<text x="893.0" y="321.0" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">204 and a token</text>
<text x="893.0" y="343.0" font-size="13" fill="#a7f3d0" text-anchor="middle">the identity token is in</text>
<text x="893.0" y="361.0" font-size="13" fill="#a7f3d0" text-anchor="middle">the header X-Identity-Token</text>
<rect x="36" y="392" width="590" height="100" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="52" y="417.0" font-size="15" font-weight="700" fill="#a5b4fc" text-anchor="start">How the gate finds the service</text>
<text x="52" y="436" font-size="13" fill="#c7d2fe" text-anchor="start">The owner is the service with the longest path prefix of its href.</text>
<text x="52" y="455" font-size="13" fill="#c7d2fe" text-anchor="start">portal reads the path in every way a proxy can read it</text>
<text x="52" y="474" font-size="13" fill="#c7d2fe" text-anchor="start">(%2e%2e, //, %2f, backslash). Every reading must be allowed.</text>
<rect x="654" y="392" width="590" height="100" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="670" y="417.0" font-size="15" font-weight="700" fill="#a5b4fc" text-anchor="start">What the gate never does</text>
<text x="670" y="436" font-size="13" fill="#c7d2fe" text-anchor="start">It never sees the body of a request. It never decides with an</text>
<text x="670" y="455" font-size="13" fill="#c7d2fe" text-anchor="start">incomplete catalogue: until the first full list, only the</text>
<text x="670" y="474" font-size="13" fill="#c7d2fe" text-anchor="start">superadmin passes. An unreadable X-Forwarded-Uri gets 400.</text>
</g>
</svg>
