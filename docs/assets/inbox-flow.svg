<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" role="img" aria-label="Inbox flow: sender, portal, phone with a Noise session, and the approval of an agent action">
<title>The Inbox flow: alerts and approvals</title><desc>A sender posts an alert with an api key. portal stores the alert and one delivery for each subscribed phone in one transaction, answers 201, and sends the alert on the Noise session of each phone. The phone confirms it. For an approval, a service asks the PDP, gets approval_required, and submits an approval request. portal sends it to the phone and to the web page. The person approves or refuses. The service asks again, and the PDP consumes the approval once.</desc>
<defs><marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
<rect width="1280" height="770" rx="20" fill="#12142a"/>
<g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<text x="36" y="46" font-size="25" font-weight="700" fill="#ffffff">The Inbox: an alert and an approval</text>
<text x="36" y="73" font-size="15" fill="#9ca3d4">One port serves the pages, the senders and the phones. The phone session is Noise IK inside a WebSocket.</text>
<rect x="22" y="94" width="156" height="54" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="100.0" y="117.5" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="middle">Sender</text>
<text x="100.0" y="139.5" font-size="12" fill="#c7d2fe" text-anchor="middle">key api_...</text>
<line x1="100" y1="150" x2="100" y2="750" stroke="#3b4180" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="262" y="94" width="156" height="54" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="340.0" y="117.5" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="middle">Service</text>
<text x="340.0" y="139.5" font-size="12" fill="#c7d2fe" text-anchor="middle">PEP of an agent</text>
<line x1="340" y1="150" x2="340" y2="750" stroke="#3b4180" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="572" y="94" width="156" height="54" rx="12" fill="#4338ca" fill-opacity=".38" stroke="#818cf8" stroke-width="1.6"/>
<text x="650.0" y="117.5" font-size="16" font-weight="700" fill="#e0e7ff" text-anchor="middle">portal</text>
<text x="650.0" y="139.5" font-size="12" fill="#c7d2fe" text-anchor="middle">Inbox + PDP</text>
<line x1="650" y1="150" x2="650" y2="750" stroke="#3b4180" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="852" y="94" width="156" height="54" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="1.6"/>
<text x="930.0" y="117.5" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">Phone</text>
<text x="930.0" y="139.5" font-size="12" fill="#a7f3d0" text-anchor="middle">Portal Inbox</text>
<line x1="930" y1="150" x2="930" y2="750" stroke="#3b4180" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="1092" y="94" width="156" height="54" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.6"/>
<text x="1170.0" y="117.5" font-size="16" font-weight="700" fill="#a5b4fc" text-anchor="middle">Person</text>
<text x="1170.0" y="139.5" font-size="12" fill="#c7d2fe" text-anchor="middle">owner of the key</text>
<line x1="1170" y1="150" x2="1170" y2="750" stroke="#3b4180" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="20" y="160" width="1240" height="244" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#2c3070"/>
<text x="32" y="182" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="start">ALERT</text>
<path d="M104 214 L644 214" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<circle cx="122" cy="214" r="12" fill="#4338ca"/>
<text x="122" y="218.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="387.0" y="206" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">POST /api/v1/alerts</text>
<text x="387.0" y="231" font-size="12" fill="#9ca3d4" text-anchor="middle">Authorization: Bearer api_..., no ForwardAuth</text>
<path d="M646 268 L106 268" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<circle cx="628" cy="268" r="12" fill="#047857"/>
<text x="628" y="272.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="363.0" y="260" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">201 after the commit</text>
<text x="363.0" y="285" font-size="12" fill="#9ca3d4" text-anchor="middle">the alert and one delivery per phone, one transaction</text>
<path d="M654 326 L924 326" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<circle cx="672" cy="326" r="12" fill="#4338ca"/>
<text x="672" y="330.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="802.0" y="318" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">alert on the Noise session</text>
<text x="802.0" y="343" font-size="12" fill="#9ca3d4" text-anchor="middle">sent again until the phone confirms</text>
<path d="M926 382 L656 382" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<circle cx="908" cy="382" r="12" fill="#047857"/>
<text x="908" y="386.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="778.0" y="374" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">confirm</text>
<text x="778.0" y="399" font-size="12" fill="#9ca3d4" text-anchor="middle">the phone shows each alert one time</text>
<rect x="20" y="420" width="1240" height="330" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#2c3070"/>
<text x="32" y="442" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="start">APPROVAL OF AN ACTION OF AN AGENT</text>
<path d="M344 478 L644 478" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<circle cx="362" cy="478" r="12" fill="#4338ca"/>
<text x="362" y="482.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="507.0" y="470" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">ask the PDP (port 4182)</text>
<text x="507.0" y="495" font-size="12" fill="#9ca3d4" text-anchor="middle">answer: approval_required</text>
<path d="M344 534 L644 534" fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#ah-a)" stroke-linejoin="round"/>
<circle cx="362" cy="534" r="12" fill="#4338ca"/>
<text x="362" y="538.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="507.0" y="526" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">POST /approval/v1/requests</text>
<text x="507.0" y="551" font-size="12" fill="#9ca3d4" text-anchor="middle">effect hash, operation and a view for the person</text>
<path d="M654 590 L924 590" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah-warn)" stroke-linejoin="round"/>
<circle cx="672" cy="590" r="12" fill="#b45309"/>
<text x="672" y="594.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="802.0" y="582" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">the request, to the phone</text>
<text x="802.0" y="607" font-size="12" fill="#9ca3d4" text-anchor="middle">and to the web page: it names the agent and the key</text>
<path d="M1166 646 L656 646" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah-warn)" stroke-linejoin="round"/>
<circle cx="1148" cy="646" r="12" fill="#b45309"/>
<text x="1148" y="650.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="898.0" y="638" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">approve or refuse</text>
<text x="898.0" y="663" font-size="12" fill="#9ca3d4" text-anchor="middle">on the phone or on the web page</text>
<path d="M344 702 L644 702" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ah-ok)" stroke-linejoin="round"/>
<circle cx="362" cy="702" r="12" fill="#047857"/>
<text x="362" y="706.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="507.0" y="694" font-size="13.5" font-weight="600" fill="#e0e7ff" text-anchor="middle">ask the PDP again</text>
<text x="507.0" y="719" font-size="12" fill="#9ca3d4" text-anchor="middle">true, and the PDP uses the approval once</text>
</g>
</svg>
