# Grafana alerting provisioning: a "Webhook" contact point for the inbox of the portal.
# Place it in /etc/grafana/provisioning/alerting/ and set INBOX_URL / INBOX_TOKEN
# in Grafana's environment (Grafana expands $__env{...} in provisioning files).
# INBOX_URL is the address of inbox.devices.listen. INBOX_TOKEN is the value of a block `producer`,
# or a key of the portal (mcp_...) that has the permission alert.send on the group.
#
# Grafana contact points are built into Grafana and cannot be extended by plugins,
# so the inbox accepts the Alertmanager-compatible payload of the Webhook contact point.
# The last path element is the group to alert. The token must be allowed to send to it.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: inbox-oncall
    receivers:
      - uid: inbox-oncall
        type: webhook
        settings:
          url: $__env{INBOX_URL}/api/v1/webhooks/alertmanager/infra
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__env{INBOX_TOKEN}
          maxAlerts: 50
        disableResolveMessage: true

policies:
  - orgId: 1
    receiver: inbox-oncall
    group_by: ["alertname"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
