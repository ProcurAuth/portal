[workspace]
resolver = "3"
members = [".", "crates/inbox-core", "crates/inbox-android"]
# The JNI crate only builds for Android targets.
default-members = [".", "crates/inbox-core"]

[workspace.package]
version = "5.4.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# snow's "std" feature would pull ring (C + asm) for nothing: leave it off.
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
# The operating system generator for the enrollment secret.
rand_core = "0.6"
zeroize = "1.9.0"
base64 = "0.22"
# The Markdown of the text of an agent, parsed by the server and by the phone. The default features pull the HTML writer and
# the command line: the renderers of the portal are its own.
pulldown-cmark = { version = "=0.13.4", default-features = false }

[package]
name = "portal"
version = "5.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Launcher, accounts, keys with limits, AuthZEN decision point and inbox for a homelab"
repository = "https://github.com/ProcurAuth/portal"
publish = false

[dependencies]
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
getrandom = "=0.3.4"
argon2 = "=0.5.3"
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64ct = { version = "=1.8.0", features = ["alloc"] }
zeroize = "=1.9.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
webpki-root-certs = "=1.0.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
# Ed25519 signatures of the identity tokens. The same crate and version as the TLS stack of reqwest
# (rustls), so the build adds no new C library.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The QR code of the enrolment of the second factor, as inline SVG markup. Pure Rust. The features `image` and `pdf`
# (default) are off: they pull the image crates. The code needs only the SVG renderer.
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
# PostgreSQL (several active instances share one database). Blocking client over plain TCP: no TLS stack, no C dependency.
postgres = { version = "=0.19.14", default-features = false }

# The inbox (the module `src/inbox`).
# The protocol and the cryptography of the phones. The Android app shares this crate.
inbox-core = { path = "crates/inbox-core" }
# The asynchronous PostgreSQL client of the inbox and its pool. Plain TCP, no TLS stack. The version is the
# version that `postgres` already uses.
tokio-postgres = { version = "=0.7.18", default-features = false }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1"] }
# The WebSocket of the phones. The upgrade of the connection comes from hyper. No TLS feature.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# The IANA time zones of the digest and of the quiet hours (lot L11). The feature `tzdb-bundle-always` embeds the database in the
# binary (about 200 KB): the static image has no `/usr/share/zoneinfo`. The server never reads the zone files of the host. The
# crate is for the server only: `inbox-core` and the phone do not use it.
jiff = { version = "=0.2.41", default-features = false, features = ["std", "tzdb-bundle-always"] }
# NFKC of the name of an agent and of the text that an agent says about itself (lot G1a): two names that look the same fold to
# one value. The crate is already in the build (the SCRAM code of PostgreSQL uses it), so the binary does not grow.
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }

[dev-dependencies]
# The tests of the inbox drive the real binary with the real protocol.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
